name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install "homeassistant==2025.1.4" "pytest==8.3.4" "pytest-asyncio==0.24.0"
      - name: Run tests
        run: python -m pytest
